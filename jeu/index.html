<style>
/* Console de poche nocturne : écran au centre, commandes dessous. Un seul thème, sombre, assumé. */

html, body { height: 100%; }

  color: #e8e6df; font-family: var(--pix); overflow: hidden; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}

}

.box { position: absolute; box-sizing: border-box; }

}
